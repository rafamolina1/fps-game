<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pátio • FPS</title><link rel="stylesheet" href="/style.css"></head><body>
<canvas id="arena" aria-label="Arena em primeira pessoa"></canvas>
<main id="panel"><h1>PÁTIO<span> / FPS</span></h1>
<section id="home"><p>Duas equipes. Uma vida por rodada. A primeira a vencer três leva a partida.</p><label>Apelido<input maxlength="18" id="nick" placeholder="Seu nome"></label><label>Limite da sala<select id="cap"><option>8</option><option>6</option><option>4</option><option>2</option><option>1</option></select></label><button id="create" disabled>Criar sala privada</button><div class="row"><input id="code" maxlength="6" placeholder="Código da sala" aria-label="Código da sala"><button id="join" disabled>Entrar</button></div></section>
<section id="room" hidden><h2 id="title"></h2><p id="summary"></p><ul id="roster"></ul><button id="copy">Copiar convite</button><button id="start">Iniciar partida</button></section>
<section id="pause" hidden><h2 id="pauseTitle">Entrar na arena</h2><p>WASD para mover, mouse ou setas para virar, clique ou espaço para disparar e R para recarregar. Esc abre o menu.</p><button id="resume">Jogar</button></section>
<button id="back" hidden>Voltar ao lobby</button><button id="exit" hidden>Sair da sala</button><output id="msg" role="status">Carregando…</output></main>
<div id="hud" hidden><div id="score"></div><div id="notice"></div><div id="stats"></div></div>
<script type="module">try{await import('./game.js')}catch(e){document.getElementById('msg').textContent='Falha ao carregar o jogo: '+e.message}</script></body></html>
